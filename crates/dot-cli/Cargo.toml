[package]
name = "dot-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "dot: bootstrap and maintain macOS, Linux and Windows machines from a repository of dotfiles"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "dot"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dot-core.workspace = true
dot-directives.workspace = true
dot-platform.workspace = true
dot-secrets.workspace = true
serde_json.workspace = true
humantime.workspace = true
dirs.workspace = true
indicatif.workspace = true
console.workspace = true
serde.workspace = true
zeroize.workspace = true
regex.workspace = true
# `dot apply --host`: this machine's local.env values, read verbatim.
dotenvy.workspace = true
# `dot self-update`: the download is staged next to the binary and checked against SHA256SUMS.
sha2.workspace = true
# `dot apply --host`: the repository as a tar stream when rsync is missing.
tar.workspace = true
flate2.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
serde_json.workspace = true
indicatif = { workspace = true, features = ["in_memory"] }
# Release archive fixtures for `dot self-update`.
tar.workspace = true
flate2.workspace = true
zip.workspace = true
