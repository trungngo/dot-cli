# yaml-language-server: $schema=https://github.com/trungngo/dot-cli/releases/latest/download/secrets.schema.json
#
# Where each secret lives, by logical name. This file holds no values: bundles ask for
# `secret("example_api_token")`, and this mapping says where to find it. Here, in
# ~/.config/dot/secrets.env (owner-only, outside the repository); see `.env.example`.

default_provider: envfile
providers:
  envfile: { path: "~/.config/dot/secrets.env" }
secrets:
  # Optional: a machine without it skips the steps that use it instead of failing.
  example_api_token: { ref: "envfile:EXAMPLE_API_TOKEN", optional: true }
