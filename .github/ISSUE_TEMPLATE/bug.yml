name: Bug report
description: Something dot did wrong, or a confusing error.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **redact anything private** before you paste it: hostnames,
        user names, paths you'd rather not share, and above all tokens or passwords. `dot`
        redacts secret values from its own output, but not what your commands print.

        Security problems: please don't file them here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command you ran, and the smallest `dot.yml` / `bundle.yml` that shows the problem.
      render: yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "`dot --version`"
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: "`dot facts`"
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`dot doctor`"
      render: text
  - type: textarea
    id: log
    attributes:
      label: Output, or the relevant part of the log
      description: |
        Every run writes a full log (`~/.local/state/dot/logs/` by default; the failure block
        prints the file's path). Rerunning with `-vv` streams command output.
      render: text
